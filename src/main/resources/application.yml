server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: emprestimos-api
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/emprestimos
    username: emprestimos
    password: emprestimos123

logging:
  level:
    root: INFO
    br.com.empresa.emprestimos: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"